<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tides</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <button id="btnSearch" class="loc" aria-label="Change location">
    <span id="locName">Tides</span>
    <span id="locSrc" class="src"></span>
  </button>
  <div class="actions">
    <button id="btnFav" class="icon" aria-label="Save favourite">☆</button>
    <button id="btnGps" class="icon" aria-label="Use my location">◎</button>
  </div>
</header>

<main id="main">
  <section class="hero card">
    <div>
      <div class="label">Now</div>
      <div class="big"><span id="nowH">–</span><span id="nowDir" class="dir"></span></div>
      <div id="nowSub" class="sub"></div>
    </div>
    <div class="next">
      <div class="label" id="nextLbl">Next</div>
      <div class="mid" id="nextTime">–</div>
      <div class="sub" id="nextIn"></div>
    </div>
  </section>

  <nav id="days" class="days"></nav>

  <section class="card chartcard">
    <div class="charthead">
      <button id="prevDay" class="icon sm" aria-label="Previous day">‹</button>
      <div id="dayTitle"></div>
      <button id="nextDay" class="icon sm" aria-label="Next day">›</button>
    </div>
    <div id="chart" class="chart"></div>
    <div id="scrub" class="scrubinfo"></div>
    <div id="extremes" class="extremes"></div>
  </section>

  <section class="card">
    <div class="cardtitle">Wind &amp; swell <span id="condAt" class="muted"></span></div>
    <div class="cond">
      <div><div class="label">Wind</div><div class="mid" id="windNow">–</div><div class="sub" id="windSub"></div></div>
      <div><div class="label">Swell</div><div class="mid" id="waveNow">–</div><div class="sub" id="waveSub"></div></div>
    </div>
    <div id="hourly" class="hourly"></div>
  </section>

  <section class="card">
    <div class="cardtitle">Sun &amp; moon</div>
    <div class="sunmoon">
      <div><div class="label">Sunrise</div><div class="mid" id="sunrise">–</div></div>
      <div><div class="label">Sunset</div><div class="mid" id="sunset">–</div></div>
      <div class="moon"><div id="moonIcon"></div><div><div class="mid" id="moonName">–</div><div class="sub" id="moonSub"></div></div></div>
    </div>
  </section>

  <footer class="foot">
    <div id="disclaimer"></div>
    <div class="units">
      <button id="uH" class="chip"></button>
      <button id="uW" class="chip"></button>
      <button id="uSrc" class="chip" hidden></button>
    </div>
    <div class="muted">Data: NOAA CO-OPS · Open-Meteo · BigDataCloud. Not for navigation.</div>
  </footer>
</main>

<div id="status" class="status" hidden></div>

<div id="sheet" class="sheet" hidden>
  <div class="sheetbody">
    <div class="sheethead">
      <input id="q" type="search" placeholder="Search a place or beach town…" autocomplete="off">
      <button id="closeSheet" class="icon sm" aria-label="Close">✕</button>
    </div>
    <div id="results"></div>
    <div class="cardtitle">Favourites</div>
    <div id="favs"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
